networks:
  floslabs:
    driver: bridge

services:
  redis:
    image: 'redis/redis-stack:6.2.6-v17'
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    volumes:
      - ./redis-data:/data
    environment:
      REDIS_ARGS: '--appendonly yes'
    networks:
      - floslabs
  backend:
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    restart: on-failure
    build: backend
    environment:
      REDIS_URL: 'redis://redis:6379'
      ORIGIN: 'https://floslabs.de'
    depends_on:
      - redis
    networks:
      - floslabs
  nginx:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: on-failure
    build:
      context: ./
      dockerfile: ./nginx/prod-Dockerfile
    depends_on:
    - backend
    networks:
      - floslabs


