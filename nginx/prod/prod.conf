# Human-readable. Adds request timing so you can spot slow endpoints, plus the upstream response time if you proxy.
log_format detailed
    '$remote_addr - $remote_user [$time_local] '
    '"$request" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent" '
    'rt=$request_time urt="$upstream_response_time"';

log_format json_combined escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"remote_user":"$remote_user",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer",'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"'
'}';

# ------------------------------------------------------------
#  BAD / UNWANTED USER AGENTS
#
#  The map sets $bad_bot to 1 for anything matched. ~* means
#  case-insensitive regex. Order does not matter; last match
#  wins, default is 0 (allowed).
#
#  Remember: this only stops clients that send these UAs
#  honestly. It is a cheap, high-value filter for noisy
#  scanners and lazy scrapers, NOT a defense against a
#  determined attacker who can set any UA they like.
# ------------------------------------------------------------
map $http_user_agent $bad_bot {
    default 0;

    # Empty / missing UA — almost always a script or scanner.
    # Very high signal, low false-positive. Safe to keep on.
    ""      1;

    # Known vulnerability scanners & exploit tooling.
    ~*(nikto|sqlmap|nmap|masscan|nessus|whatweb|wpscan|dirbuster|gobuster|fimap|joomscan|acunetix|netsparker) 1;

    # ---- generic HTTP libraries -------------------
    # CAUTION: curl / wget / python-requests / go-http-client
    ~*(libwww-perl|python-requests|python-urllib|go-http-client|java/|curl|wget|scrapy|httpclient|node-fetch) 1;

    # ---- aggressive SEO / marketing crawlers ------
    ~*(ahrefsbot|semrushbot|mj12bot|dotbot|blexbot|petalbot|megaindex|seznambot) 1;
}


# ------------------------------------------------------------
#  RATE LIMITING
#
#  Catches aggressive behaviour no matter what UA is claimed.
#  Tune the rates to your real traffic before going live, or
#  you risk throttling legitimate users.
# ------------------------------------------------------------

# Requests per second, per client IP. 10m of shared memory
# tracks roughly 160k IPs.
# limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=10r/s;

# Simultaneous connections per client IP.
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# Return 429 (Too Many Requests) instead of the default 503,
# and log rejections at warn level so they show in error.log.
# limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

upstream backends {
  ip_hash;
  server brettspieleio-backend-1:8080;
  server brettspieleio-backend-2:8080;
}

server {
    #  Block flagged user agents.
    if ($bad_bot) {
        return 444;
    }


    #  Block directory traversal attempts.
    if ($request_uri ~* "(\.\./|\.\.%2f|%2e%2e/|%2e%2e%2f|\.\.\\|\.\.%5c|%2e%2e%5c)") {
        return 444;
    }


    # ------------------------------------------------------------
    #  Apply rate limits.
    #  burst=20  : allow short spikes of up to 20 queued requests
    #  nodelay   : serve the burst immediately instead of spacing
    #              it out; excess beyond the burst gets 429.
    # ------------------------------------------------------------
    # limit_req  zone=req_per_ip burst=20 nodelay;
    # limit_conn conn_per_ip 20;


    # --- All PHP files --------------------------------------------
    # Catches .php, .php5/.php7 etc., and .phtml
    location ~* \.(php\d?|phtml)$ {
        return 444;
    }

    # --- .env files (and variants) --------------------------------
    # Covers .env, .env.local, .env.production, config.env, app.env.bak, .envrc, etc. — anywhere in the tree.
    location ~* \.env {
        return 444;
    }

    # --- Hidden dotfiles / dirs -----------------------------------
    # Blocks .git, .htaccess, .aws, .ssh, .svn, .DS_Store and any path segment starting with a dot
    location ~ /\. {
        return 444;
    }

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    listen 80;

    location /api {
        proxy_pass http://backends;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location / {
        root /app/dist;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

  
